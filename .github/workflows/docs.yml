# Automation of documentation MKDocs on github at each push
name: Deploy docs
on:
  push:
    branches: [main]
    paths:
      - 'documentation/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .[docs]
      - run: mkdocs gh-deploy --force --clean