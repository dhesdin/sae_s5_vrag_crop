[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v-crop-rag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "httpx>=0.28,<1",
                ]

[tool.setuptools.packages.find]
where = ["src"]
include = ["v_crop_rag*"]

[project.optional-dependencies]
dev = [
"ruff>=0.15,<0.16",
"pytest>=9.1,<10.0"
]


[tool.ruff]
line-length = 150
target-version = "py310"
include = ["src/**/*.py", "tests/**/*.py"]
exclude = [".git", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]